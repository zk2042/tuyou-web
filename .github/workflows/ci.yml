name: H5 CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: h5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production H5
        run: pnpm run build:h5:prod
        env:
          TARO_APP_API_BASE: /api/v1
      - name: Verify H5 output
        run: |
          test -s dist/index.html
          ! grep -R -q 'http://192.168.10.7:84/api/v1' dist
          ! grep -R -q '192.168.10.7:89' dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: web-h5-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
