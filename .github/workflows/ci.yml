name: H5 CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production H5
        run: pnpm run build:h5:prod
        env:
          TARO_APP_API_BASE: /api/v1
      - name: Verify H5 output
        run: |
          test -s src/assets/logo.png
          test -s dist/index.html
          test -s dist/h5-static/images/assets/logo.png
          ! grep -R -q 'http://192.168.10.7:84/api/v1' dist
          ! grep -R -q '192.168.10.7:89' dist
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: web-h5-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy production H5
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.TUYOU_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo '::notice::TuYou deployment key is not configured; build artifact was retained.'
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/tuyou-deploy"
          chmod 600 "$HOME/.ssh/tuyou-deploy"
          printf '%s\n' '47.122.110.148 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGg9Z5NuOEdqsh5hnKSpk+p1hJDX53tWqvNHVVTPepLe' > "$HOME/.ssh/known_hosts"
          tar -czf - -C dist . | ssh -T -i "$HOME/.ssh/tuyou-deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes tuyou-web-deploy@47.122.110.148 "$GITHUB_SHA $GITHUB_RUN_NUMBER"
