<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片来源 - 途友</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #202620; background: #fff; font: 15px/1.6 system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 28px 20px 56px; }
    h1 { margin: 0 0 20px; font-size: 22px; line-height: 1.4; }
    article { padding: 20px 0; border-top: 1px solid #e3e8e4; }
    article img { display: block; width: 100%; max-height: 420px; object-fit: contain; background: #f3f5f3; }
    article h2 { margin: 16px 0 8px; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
    p { margin: 5px 0; overflow-wrap: anywhere; }
    a { color: #286d43; }
    .muted { color: #68716a; }
  </style>
</head>
<body>
  <main>
    <h1>图片来源</h1>
    <div id="credits" aria-live="polite">正在加载...</div>
  </main>
  <script>
    const root = document.getElementById('credits');
    const key = new URLSearchParams(location.search).get('key');
    fetch('./credits.json')
      .then(response => {
        if (!response.ok) throw new Error('图片资料暂时无法加载');
        return response.json();
      })
      .then(credits => {
        const selected = key ? credits.filter(item => item.key === key) : credits;
        root.textContent = '';
        if (!selected.length) {
          root.textContent = '未找到这张图片的来源记录。';
          return;
        }
        for (const item of selected) {
          const article = document.createElement('article');
          const photo = document.createElement('img');
          photo.src = `./${item.key}.jpg`;
          photo.alt = item.title.replace(/^File:/, '');
          const title = document.createElement('h2');
          title.textContent = photo.alt;
          const author = document.createElement('p');
          author.textContent = `摄影：${item.author}`;
          const source = document.createElement('p');
          const sourceLink = document.createElement('a');
          sourceLink.href = item.source;
          sourceLink.textContent = '查看 Wikimedia Commons 原图';
          sourceLink.rel = 'noopener noreferrer';
          sourceLink.target = '_blank';
          source.append(sourceLink);
          const license = document.createElement('p');
          license.className = 'muted';
          license.append('许可：');
          const licenseLink = document.createElement('a');
          licenseLink.href = item.licenseUrl;
          licenseLink.textContent = item.license;
          licenseLink.rel = 'noopener noreferrer';
          licenseLink.target = '_blank';
          license.append(licenseLink);
          article.append(photo, title, author, source, license);
          root.append(article);
        }
      })
      .catch(() => { root.textContent = '图片资料暂时无法加载。'; });
  </script>
</body>
</html>
